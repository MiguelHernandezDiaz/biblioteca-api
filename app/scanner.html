<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de ISBN - Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <style>
        .laser-line {
            animation: scan 2s infinite linear;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col items-center p-4 sm:p-8 font-sans">

    <div class="max-w-md w-full mx-auto space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-white tracking-tight">Escáner de Libros</h1>
            <p class="text-sm text-slate-400">Escanea el código de barras (ISBN) para agregarlo al inventario.</p>
        </div>

        <!-- Escáner -->
        <div class="relative bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-xl aspect-[4/3] flex items-center justify-center">
            
            <video id="video" class="absolute inset-0 w-full h-full object-cover"></video>
            
            <!-- Overlay visual -->
            <div id="overlay" class="absolute z-10 w-64 h-40 border-2 border-dashed border-white/50 rounded-xl pointer-events-none flex items-center justify-center">
                <div class="absolute w-full h-0.5 bg-emerald-400 shadow-[0_0_8px_#34d399] laser-line"></div>
                <div class="absolute -top-1 -left-1 w-4 h-4 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></div>
                <div class="absolute -top-1 -right-1 w-4 h-4 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></div>
                <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></div>
                <div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></div>
            </div>

            <!-- Botón iniciar/detener -->
            <div class="absolute bottom-4 z-20 flex gap-2">
                <button id="start-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition-colors shadow-lg">
                    Iniciar Cámara
                </button>
            </div>
            
            <div id="error-message" class="absolute inset-0 bg-slate-950/90 z-30 hidden flex-col items-center justify-center text-center p-6">
                <p id="error-text" class="text-sm text-red-400 font-medium mb-4"></p>
                <button id="retry-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm transition-colors">Reintentar</button>
            </div>
        </div>

        <!-- Formulario Resultado -->
        <div id="result-card" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg space-y-4 transition-all">
            <div class="flex gap-4">
                <img id="book-cover" src="" alt="Portada" class="w-20 h-28 object-cover rounded-md bg-slate-800 hidden">
                <div class="flex-1 space-y-1">
                    <h3 id="book-title" class="font-bold text-white leading-tight">Buscando...</h3>
                    <p id="book-author" class="text-sm text-slate-400"></p>
                    <div class="inline-block px-2 py-0.5 bg-slate-800 rounded text-xs font-mono text-emerald-400 mt-2" id="book-isbn"></div>
                </div>
            </div>

            <form id="add-book-form" class="hidden space-y-3 pt-3 border-t border-slate-800">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Copias totales a ingresar</label>
                    <input type="number" id="book-copies" min="1" value="1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" id="submit-btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg transition-colors">
                    Guardar Libro
                </button>
            </form>
            <div id="success-msg" class="hidden text-emerald-400 text-sm font-medium text-center py-2 bg-emerald-500/10 rounded-lg">
                ¡Libro guardado exitosamente!
            </div>
        </div>
    </div>

    <script>
        let codeReader;
        let isScanning = false;
        
        const video = document.getElementById('video');
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const retryBtn = document.getElementById('retry-btn');
        
        const resultCard = document.getElementById('result-card');
        const bookTitle = document.getElementById('book-title');
        const bookAuthor = document.getElementById('book-author');
        const bookIsbn = document.getElementById('book-isbn');
        const bookCover = document.getElementById('book-cover');
        const addBookForm = document.getElementById('add-book-form');
        const submitBtn = document.getElementById('submit-btn');
        const successMsg = document.getElementById('success-msg');

        let currentBookData = null;

        async function initScanner() {
            try {
                codeReader = new ZXing.BrowserMultiFormatReader();
                const hints = new Map();
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.EAN_8,
                    ZXing.BarcodeFormat.CODE_128,
                    ZXing.BarcodeFormat.UPC_A
                ]);
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                codeReader.hints = hints;
            } catch (err) {
                console.error("Error init:", err);
            }
        }

        async function startScanning() {
            if (isScanning) return;
            errorMsg.classList.add('hidden');
            resultCard.classList.add('hidden');
            addBookForm.classList.add('hidden');
            successMsg.classList.add('hidden');
            
            try {
                if (!codeReader) await initScanner();
                
                const devices = await codeReader.listVideoInputDevices();
                const selectedDeviceId = devices.length > 0 ? devices[devices.length - 1].deviceId : undefined;

                startBtn.textContent = 'Detener';
                startBtn.classList.replace('bg-blue-600', 'bg-red-600');
                startBtn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
                isScanning = true;

                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result) {
                        handleBarcode(result.text);
                    }
                });
            } catch (err) {
                console.error(err);
                showError("No se pudo acceder a la cámara. Revisa los permisos o asegúrate de usar HTTPS o localhost.");
                stopScanning();
            }
        }

        function stopScanning() {
            if (codeReader) {
                codeReader.reset();
            }
            isScanning = false;
            startBtn.textContent = 'Iniciar Cámara';
            startBtn.classList.replace('bg-red-600', 'bg-blue-600');
            startBtn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
        }

        function showError(msg) {
            errorText.innerHTML = msg + "<br><br><span class='text-xs text-slate-300'>Para usar en tu móvil: Entra a <strong>https://IP_DE_TU_PC/scanner</strong> y acepta el certificado local.</span>";
            errorMsg.classList.remove('hidden');
        }

        async function handleBarcode(isbn) {
            stopScanning();
            resultCard.classList.remove('hidden');
            bookTitle.textContent = "Buscando en Open Library...";
            bookAuthor.textContent = "Por favor espera...";
            bookIsbn.textContent = isbn;
            bookCover.classList.add('hidden');
            addBookForm.classList.add('hidden');
            successMsg.classList.add('hidden');

            try {
                const res = await fetch(`/open-library/${isbn}`);
                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.detail || "Libro no encontrado");
                }
                
                const data = await res.json();
                currentBookData = data;
                
                bookTitle.textContent = data.titulo;
                bookAuthor.textContent = data.autor;
                
                if (data.portada_url) {
                    bookCover.src = data.portada_url;
                    bookCover.classList.remove('hidden');
                }
                
                addBookForm.classList.remove('hidden');
                
            } catch (err) {
                bookTitle.textContent = "Error al buscar";
                bookAuthor.textContent = err.message;
            }
        }

        addBookForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentBookData) return;

            const copias = document.getElementById('book-copies').value;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            try {
                const res = await fetch('/libros/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        titulo: currentBookData.titulo,
                        autor: currentBookData.autor,
                        isbn: currentBookData.isbn,
                        copias_totales: parseInt(copias, 10),
                        portada_url: currentBookData.portada_url || ""
                    })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "Error al guardar");
                }

                addBookForm.classList.add('hidden');
                successMsg.classList.remove('hidden');
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar Libro';
            }
        });

        startBtn.addEventListener('click', () => {
            if (isScanning) {
                stopScanning();
            } else {
                startScanning();
            }
        });
        
        retryBtn.addEventListener('click', () => {
            errorMsg.classList.add('hidden');
            startScanning();
        });
    </script>
</body>
</html>
