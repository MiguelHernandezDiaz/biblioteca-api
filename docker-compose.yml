version: "3.9"

services:
  db:
    image: postgres:16
    container_name: biblioteca_db
    restart: always
    environment:
      POSTGRES_USER: biblioteca_user
      POSTGRES_PASSWORD: biblioteca_pass
      POSTGRES_DB: biblioteca_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca_user -d biblioteca_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: biblioteca_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://biblioteca_user:biblioteca_pass@db:5432/biblioteca_db
      SECRET_KEY: django-insecure-biblioteca-key-2026-prod-local
      DEBUG: "1"
    volumes:
      - .:/code
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: biblioteca_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
